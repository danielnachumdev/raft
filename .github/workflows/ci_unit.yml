# Unit + integration matrix (Python 3.9–3.13). Bakes SPA into share before pytest.

name: CI unit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Unit+Integration (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/spa/package-lock.json
      - name: Bake dashboard SPA
        run: |
          cd src/spa
          npm ci
          npm run build
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test deps
        run: uv sync --extra dev
      - name: Unit tests (100% coverage)
        run: uv run pytest tests/unit -q
      - name: Integration tests
        run: uv run pytest tests/integration -q --no-cov

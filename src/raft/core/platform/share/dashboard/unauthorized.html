<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not authorized</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 2rem;
    }
    main { max-width: 28rem; text-align: center; }
    h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
    p { margin: 0 0 1.25rem; line-height: 1.5; color: #94a3b8; }
    a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>Not authorized</h1>
    <p>This account is not on the dashboard allowlist.</p>
    <p><a href="/oauth2/sign_out">Sign out</a>
      · <a href="/oauth2/start?rd=/">Try another account</a></p>
  </main>
</body>
</html>

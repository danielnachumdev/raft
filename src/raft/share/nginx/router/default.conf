# Inner router: Host → app upstreams (flipped by raft during app redeploy).
# Public clients hit `gate` first. Friendly offline UX lives on the gate only
# (covers router-down and app-down via intercepted 502/503/504).
#
# Per-service server blocks are generated into hosts.conf (`raft render`).

include /etc/nginx/router-generated/hosts.conf;

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/errors;
    location / {
        try_files /unknown-host.html =404;
    }
}

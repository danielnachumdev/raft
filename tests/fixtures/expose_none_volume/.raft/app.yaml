apiVersion: raft/v1
kind: App
metadata:
  name: expose-none-vol
spec:
  group: demo
  source: docker
  image: redis
  ref: alpine
  path: services/expose-none-vol/checkout
  envFile: /tmp/raft-e2e-demo.env
  env:
    DEMO_FLAG: "1"
  volumes:
    - name: data
      hostPath: /tmp/raft-e2e-vol
      containerPath: /data
      readOnly: false
  ports:
    - name: redis
      containerPort: 6379
      expose: none
  readiness:
    type: tcp
    port: redis

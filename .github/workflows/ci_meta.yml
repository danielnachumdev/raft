# Meta / package-data guards (codebase-as-artifact).
# Delegates checkout / uv / pytest to danielnachumdev/actions python lane.

name: CI meta

on:
  workflow_call:

permissions:
  contents: read

jobs:
  meta:
    name: Meta
    uses: danielnachumdev/actions/.github/workflows/python.yml@latest
    with:
      python-versions: '["3.13"]'
      sync-args: --extra dev
      pytest-command: pytest tests/meta --no-cov -n0
      timeout-minutes: 15

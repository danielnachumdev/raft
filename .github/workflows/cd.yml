name: CD

# Thin orchestrator. Semver at CD = bump → SPA bake + wheel → GitHub Release
# (or skip on noBump). Raft-specific bake stays in scripts/release/build_release_wheel.sh.
# Prefer requiring "Semver / Semver" (semver.yml) for the PR label gate.
# Pin:
#   uses: danielnachumdev/actions/.github/workflows/semver-cd.yml@v1

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    # Defense in depth with the job if: (push + main). Limits which CI
    # completions even enqueue this privileged orchestrator.
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Resolve bump only; do not create a Release"
        type: boolean
        default: true
      sha:
        description: "Commit SHA (empty = current GITHUB_SHA)"
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: read
  actions: read
  # Required by semver-cd (PyPI job declares OIDC even when skipped).
  id-token: write

concurrency:
  group: cd-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  semver:
    name: Semver
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    uses: danielnachumdev/actions/.github/workflows/semver-cd.yml@v1
    with:
      standards-ref: v1
      dry-run: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
      sha: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || (github.event.inputs.sha != '' && github.event.inputs.sha || github.sha) }}
      python-version: "3.12"
      # TAG is provided in the job env by semver-cd before build-command runs.
      build-command: bash scripts/release/build_release_wheel.sh "${TAG}" dist
    # User-owned repo: map by name (secrets: inherit is org/enterprise only).
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

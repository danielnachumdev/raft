<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">raft mark</title>
  <!-- raft mark: three planks + binding ties (control-plane stack) -->
  <g id="mark">
    <rect x="6" y="14" width="52" height="10" rx="3" fill="#0f6b5c"/>
    <rect x="6" y="27" width="52" height="10" rx="3" fill="#0f6b5c"/>
    <rect x="6" y="40" width="52" height="10" rx="3" fill="#0f6b5c"/>
    <rect x="18" y="12" width="4" height="40" rx="1.5" fill="#0a4a40"/>
    <rect x="42" y="12" width="4" height="40" rx="1.5" fill="#0a4a40"/>
  </g>
</svg>

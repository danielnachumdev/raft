worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Request-plane samples for the controller (see state/metrics/http.jsonl)
    # and per-request inspection in raft serve (see docs/serve-http-requests.md).
    # Fields: request_time (s) status host [time method uri client_ip "ua"]
    # — path only ($uri, no query); no cookies/Authorization/bodies.
    # First three fields stay stable so aggregate scrape keeps working.
    log_format raft_http '$request_time $status $host '
                         '$time_iso8601 $request_method $uri $remote_addr '
                         '"$http_user_agent"';
    access_log /var/log/nginx/raft-http/access.log raft_http;

    # Internal scrape target (Compose network only; not published on the host).
    # Active/Writing are concurrency proxies — stock nginx has no true in-flight.
    server {
        listen 8081;
        server_name _;
        access_log off;
        location = /nginx_status {
            stub_status;
            allow all;
        }
    }

    include /etc/nginx/http-generated/*.conf;
    include /etc/nginx/gate-tls/*.conf;
}

stream {
    include /etc/nginx/stream-generated/*.conf;
}

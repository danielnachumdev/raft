[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "raft"
version = "0.1.0"
description = "Kubernetes-ish behaviour with Docker and nginx — App manifests and a kubectl-style CLI"
requires-python = ">=3.8"
dependencies = [
    "fire>=0.7.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=24.8.0",
    "isort>=5.13.2",
]

[project.scripts]
raft = "raft.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
raft = [
    "share/compose.yaml",
    "share/nginx/**/*",
    "share/controller/**/*",
]

[tool.pytest.ini_options]
# Default: unit + integration. E2E is opt-in (needs Docker): pytest tests/e2e -m e2e
testpaths = ["tests/unit", "tests/integration"]
pythonpath = [".", "src"]
addopts = [
    "--import-mode=importlib",
]
markers = [
    "unit: fast mocked unit tests",
    "integration: app.yaml → render artifact checks (no Docker)",
    "e2e: Docker Compose runtime checks (skipped without Docker)",
]

[tool.coverage.run]
branch = true
source = ["src/raft"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 100

[dependency-groups]
dev = [
    "black>=24.8.0",
    "isort>=5.13.2",
]

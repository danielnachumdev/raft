# Test matrix: Python 3.9+ (runtime config is YAML via PyYAML; no tomllib).
# SPA (src/spa) is tested/built once — not per Python version. Packaged assets
# under src/raft/share/serve/spa/ are committed; unit/integration/e2e use those.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  spa:
    name: SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/spa/package-lock.json
      - name: Install, test, and build dashboard SPA
        run: |
          cd src/spa
          npm ci
          npm test
          npm run build

  test:
    name: Unit+Integration (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test deps
        run: uv sync --extra dev
      - name: Unit tests (100% coverage)
        run: uv run pytest tests/unit -q
      - name: Integration tests
        run: uv run pytest tests/integration -q --no-cov

  meta:
    name: Meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.13"
      - name: Install package + test deps
        run: uv sync --extra dev
      - name: Meta tests (codebase-as-artifact)
        run: uv run pytest tests/meta --no-cov -n0

  e2e:
    name: E2E (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Cap concurrency so five Py versions do not burst Docker Hub / mirrors together.
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test deps
        run: uv sync --extra dev
      # Optional: higher Docker Hub limits when repo secrets are configured.
      - name: Login to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Seed images (ECR Public + local http-echo)
        run: bash scripts/ci_seed_docker_images.sh
      - name: E2E Compose tests
        run: uv run pytest tests/e2e -m e2e -q --tb=short --no-cov -n0

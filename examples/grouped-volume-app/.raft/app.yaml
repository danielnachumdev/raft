# Grouped docker app with an internal-only port and a bind volume.
# Apply (deploy on by default): raft apply --file examples/grouped-volume-app/.raft/app.yaml
# CI: raft apply --file .raft/app.yaml --ref SHA
#
# Demonstrates: spec.group, spec.envFile, spec.volumes, expose: none.
# Replace image/ref/paths for a real service before production use.
#
# Secrets: create ~/.raft/services/grouped-volume-app/secrets/env (mode 0600;
# directory 0700) before deploy. Never bake secrets into git, spec.env, or
# --env. Gate/router must not mount this file.

apiVersion: raft/v1
kind: App
metadata:
  name: grouped-volume-app

spec:
  group: demo
  source: docker
  image: redis
  ref: alpine
  path: services/grouped-volume-app/checkout
  envFile: /home/raft/.raft/services/grouped-volume-app/secrets/env
  volumes:
    - name: data
      hostPath: /mnt/raft-data/demo/redis
      containerPath: /data
  ports:
    - name: redis
      containerPort: 6379
      expose: none
  readiness:
    type: tcp
    port: redis

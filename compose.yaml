name: raft

# Resource budgets for a small VPS (Compose applies these with `docker compose up`).
x-resources-edge: &resources-edge
  deploy:
    resources:
      limits:
        cpus: "0.25"
        memory: 64M
      reservations:
        cpus: "0.05"
        memory: 16M

# App services + router.depends_on are generated from state/apps/*.yaml (raft apply).
# `.raft/app.yaml` into `.generated/compose.apps.yaml` (`uv run raft render`).
# project_directory must be the orchestrator root — Compose resolves paths in an
# included file relative to that file's dir by default (.generated/), which breaks builds.
include:
  - path: .generated/compose.apps.yaml
    project_directory: .

services:
  # Outer edge — public :80 / :443. Keep this stable; do not redeploy for app/router updates.
  # TLS snippets: `.generated/nginx/gate-tls/*.conf` (from contracts). PEMs under ./certs/<name>/.
  gate:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/gate/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/gate/proxy_router.inc:/etc/nginx/gate/proxy_router.inc:ro
      - ./.generated/nginx/gate-tls:/etc/nginx/gate-tls:ro
      - ./nginx/errors:/usr/share/nginx/errors:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
    <<: *resources-edge

  # Inner router — Host-based routing to apps. Safe to recreate; gate absorbs the gap.
  router:
    image: nginx:alpine
    expose:
      - "80"
    volumes:
      - ./nginx/router/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.generated/nginx/router:/etc/nginx/router-generated:ro
      - ./.generated/nginx/upstreams:/etc/nginx/upstreams:ro
      - ./nginx/errors:/usr/share/nginx/errors:ro
    restart: unless-stopped
    <<: *resources-edge

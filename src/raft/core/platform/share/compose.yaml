name: raft

x-resources-edge: &resources-edge
  deploy:
    resources:
      limits:
        cpus: "0.25"
        memory: 32M
      reservations:
        cpus: "0.05"
        memory: 16M

# Controller runs Python + docker CLI against the socket; needs more RAM than nginx.
# 192M gives headroom above log/metrics fetch bounds (still small on a 2Gi host).
x-resources-controller: &resources-controller
  deploy:
    resources:
      limits:
        cpus: "0.25"
        memory: 192M
      reservations:
        cpus: "0.05"
        memory: 32M

include:
  - path: generated/compose.apps.yaml
    project_directory: .
  - path: generated/compose.edge.yaml
    project_directory: .
  - path: generated/compose.dashboard.yaml
    project_directory: .

services:
  raft-gate:
    image: nginx:alpine
    volumes:
      - ./nginx/gate/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/gate/proxy_router.inc:/etc/nginx/gate/proxy_router.inc:ro
      - ./nginx/gate/acme_challenge.inc:/etc/nginx/gate/acme_challenge.inc:ro
      - ./generated/nginx/gate-http:/etc/nginx/http-generated:ro
      - ./generated/nginx/gate-stream:/etc/nginx/stream-generated:ro
      - ./generated/nginx/gate-tls:/etc/nginx/gate-tls:ro
      - ./nginx/errors:/usr/share/nginx/errors:ro
      # Per-app certs + scaling markers under services/<name>/ (#313).
      - ./services:/etc/nginx/services:ro
      - ./host/acme/http-01:/etc/nginx/acme-www:ro
      # Access log for HTTP request metrics (controller scrapes; reload-only after first attach).
      - ./host/metrics/gate-http:/var/log/nginx/raft-http
    restart: unless-stopped
    <<: *resources-edge

  raft-router:
    image: nginx:alpine
    expose:
      - "80"
    volumes:
      - ./nginx/router/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./generated/nginx/router:/etc/nginx/router-generated:ro
      - ./generated/nginx/upstreams:/etc/nginx/upstreams:ro
      - ./nginx/errors:/usr/share/nginx/errors:ro
    restart: unless-stopped
    <<: *resources-edge

  # Control plane: same raft package as the host CLI (built from ./controller).
  raft-controller:
    build:
      context: ./controller
    working_dir: /raft
    user: "${RAFT_HOST_UID:-0}:${RAFT_HOST_GID:-0}"
    # Socket is root:docker; host operator has docker via supplementary group.
    # Shell injects RAFT_DOCKER_GID from /var/run/docker.sock st_gid.
    group_add:
      - "${RAFT_DOCKER_GID:-0}"
    environment:
      RAFT_DATA_HOME: /raft
    expose:
      - "8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Data home read-only (avoid root-owned template files). Overlay writable
      # host/ + services/ for locks, metrics, events, alerts, ACME, scaling, logs.
      - .:/raft:ro
      - ./host/locks:/raft/host/locks
      - ./host/metrics:/raft/host/metrics
      - ./host/events:/raft/host/events
      - ./host/alerts:/raft/host/alerts
      - ./host/acme:/raft/host/acme
      - ./host/logs:/raft/host/logs
      - ./services:/raft/services
      - ./generated/nginx/upstreams:/raft/generated/nginx/upstreams
    restart: unless-stopped
    <<: *resources-controller

apiVersion: raft/v1
kind: App
metadata:
  name: host-publish
spec:
  publicHost: mail.test
  www: false
  tls: off
  source: docker
  image: hashicorp/http-echo
  ref: "1.0.0"
  path: apps/host-publish
  ports:
    - name: http
      containerPort: 5678
      expose: http
    - name: smtp
      containerPort: 25
      expose: host
      publicPort: 2525
  readiness:
    type: http
    port: http
    path: /

# Minimal HTTP-only site — TLS off, one Host-routed port.
# Apply (deploy on by default): raft apply --file examples/http-only-site/.raft/app.yaml
# CI: raft apply --file .raft/app.yaml --ref SHA   # first boot + later cutovers
# Or from a real service repo: raft apply --git git@github.com:ORG/REPO.git --ref SHA
#
# When to use: a normal website/API behind the gate+router with no HTTPS
# Origin certs on the VPS (Cloudflare Flexible, or TLS terminated elsewhere).
#
# Stage-aware apply (Dev/Prod): placeholders expand at `raft apply` on the
# entire file text (including these comments). Escape demo placeholders:
#   name: $${RAFT_APP_NAME}
#   publicHost: $${RAFT_APP_PUBLIC_HOST:-site.example.com}
#   env:
#     DATABASE_URL: $${CI_DATABASE_URL}   # Docker name ← CI/process/--env name
# Pass process env and/or --env-file / --env to fill real templates (later wins).
# CLI --env alone does not inject Compose env without a spec.env / envFile bridge.
# Registry stores the expanded concrete YAML.

apiVersion: raft/v1
kind: App
metadata:
  # Stable app id used in registry, Compose service names, certs/<name>/, etc.
  name: http-only-site

spec:
  # Required when any port uses expose: http (Host routing).
  publicHost: site.example.com

  # Also serve www.<publicHost> via the router (default true).
  www: true
  # Extra Host names routed to this app (in addition to publicHost / www).
  # extraHosts:
  #   - api.site.example.com
  #   - staging.site.example.com

  # off (default) | origin
  # off  → HTTP only through the gate; no PEMs required.
  # origin → gate terminates Cloudflare Origin TLS; needs
  #          ~/.raft/certs/<metadata.name>/origin.pem + origin.key
  #          and edge.https enabled in settings.
  tls: off

  # How raft obtains the app tree / image.
  # local  — tree already on disk at spec.path (relative to data home apps/, or absolute)
  # git    — clone/fetch spec.repo @ spec.ref into apps/; Compose build: from contract
  # docker — pull spec.image:spec.ref (image has no tag; tag/pin lives in ref)
  source: git
  repo: git@github.com:example/http-only-site.git
  ref: main
  # Checkout / working tree path under the data home (default apps/<name>).
  path: apps/http-only-site
  # For source: docker only (image without tag):
  # image: ghcr.io/example/http-only-site

  # Compose build: (used when source is git/local and you build on the VPS).
  build:
    context: .                 # relative to the checkout
    dockerfile: Dockerfile     # optional; defaults to Dockerfile

  ports:
    # name is referenced by readiness.port and must be unique per app.
    - name: http
      containerPort: 80
      # http   → Host routing via router (needs publicHost)
      # stream → gate L4 proxy; needs publicPort + matching edge.streams[].port
      # host   → app publishes publicPort on the host itself (gate not involved)
      expose: http
      # publicPort:  …   # required for stream|host only
      # protocol: tcp    # tcp | udp — for stream (default tcp)
      # proxyProtocol: false  # stream only: PROXY protocol to upstream

  readiness:
    # http | tcp | none
    # http → GET path on an expose:http port (default type when an http port exists)
    # tcp  → TCP connect to the named port
    # none → skip probes (cutover still runs; use sparingly)
    type: http
    port: http                 # ports[].name
    path: /                    # only for type: http

  # Optional CPU/RAM — rendered as Compose deploy.resources (defaults shown).
  # App keys use singular `cpu`; Compose output uses plural `cpus`.
  # `reservations` (Compose name) and `requests` (k8s-style alias) are both accepted.
  #
  # resources:
  #   limits:                 # ceiling
  #     cpu: "0.50"           # → deploy.resources.limits.cpus
  #     memory: 128M          # → deploy.resources.limits.memory
  #   reservations:           # floor (or: requests:)
  #     cpu: "0.10"           # → deploy.resources.reservations.cpus
  #     memory: 32M           # → deploy.resources.reservations.memory
  #
  # Equivalent Compose after `raft render`:
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: "0.50"
  #         memory: 128M
  #       reservations:
  #         cpus: "0.10"
  #         memory: 32M

  # Optional scale-to-zero (off by default — omit the whole block).
  # When present, every field is required (no partial defaults). Eligible only
  # with at least one expose: http + publicHost. Idle stop + gate holding page
  # + wake ship together; holding-page reloads do not count as activity.
  #
  # scaling:
  #   idleSeconds: 300
  #   wakeTimeoutSeconds: 60
  #   minUpSeconds: 60

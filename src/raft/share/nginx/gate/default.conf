# Public edge (gate): NEVER redeploy casually — stays up while router/apps change.
# Offline page is ONLY here: router unreachable OR router returns 502/503/504 (app down).
# TLS: per-service SNI via /etc/nginx/gate-tls/*.conf; PEMs at /etc/nginx/certs/<name>/.
# Unknown SNI: ssl_reject_handshake (no shared fallback cert).

server {
    listen 80 default_server;
    server_name _;

    include /etc/nginx/gate/proxy_router.inc;
}

include /etc/nginx/gate-tls/*.conf;

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

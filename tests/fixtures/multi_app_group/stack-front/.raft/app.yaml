apiVersion: raft/v1
kind: App
metadata:
  name: stack-front
spec:
  group: demo
  dependsOn: [stack-redis]
  source: docker
  image: hashicorp/http-echo
  ref: "1.0.0"
  path: apps/stack-front
  www: false
  ports:
    - name: http
      containerPort: 5678
      expose: http
  publicHost: front.test
  readiness:
    type: http
    port: http
    path: /

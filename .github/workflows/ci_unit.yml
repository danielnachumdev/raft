# Unit matrix (local: must bake SPA into share before pytest) + integration via
# actions python.yml + pytest-command (no SPA bake required).
# Caller selects Python versions (full matrix on PR vs bookends on main).

name: CI unit

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON array of Python versions (e.g. '["3.11","3.12","3.13"]')
        type: string
        default: '["3.11","3.12","3.13"]'

permissions:
  contents: read

jobs:
  unit:
    name: Unit (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/spa/package-lock.json
      - name: Bake dashboard SPA
        run: |
          cd src/spa
          npm ci
          npm run build
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test deps
        run: uv sync --extra dev
      - name: Unit tests (100% coverage)
        run: uv run pytest tests/unit -q

  integration:
    name: Integration
    uses: danielnachumdev/actions/.github/workflows/python.yml@latest
    with:
      python-versions: ${{ inputs.python-versions }}
      sync-args: --extra dev
      pytest-command: pytest tests/integration -q --no-cov
      timeout-minutes: 30

# raft operator settings — copy to ~/.raft/settings.yaml (created on first use with defaults).
# This file lives under examples/; override the data home with RAFT_DATA_HOME (default: ~/.raft).

logging:
  # Directory for log files (relative to the data home, or absolute).
  # Override with env RAFT_LOG_DIR.
  # Terminal output is always plain text; only this file uses log formatting.
  dir: logs
  file: raft.log
  level: INFO   # DEBUG | INFO | WARNING | ERROR

# Public edge listeners published by the gate container.
# null http/https → that listener is omitted. New stream ports need
# `raft gate recreate` after changing this section.
edge:
  http: 80
  https: 443
  streams:
    # - name: smtp
    #   port: 25
    #   protocol: tcp

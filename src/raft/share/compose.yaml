name: raft

x-resources-edge: &resources-edge
  deploy:
    resources:
      limits:
        cpus: "0.25"
        memory: 32M
      reservations:
        cpus: "0.05"
        memory: 16M

# Controller runs Python + docker CLI against the socket; needs more RAM than nginx.
x-resources-controller: &resources-controller
  deploy:
    resources:
      limits:
        cpus: "0.25"
        memory: 128M
      reservations:
        cpus: "0.05"
        memory: 32M

include:
  - path: generated/compose.apps.yaml
    project_directory: .
  - path: generated/compose.edge.yaml
    project_directory: .

services:
  raft-gate:
    image: nginx:alpine
    volumes:
      - ./nginx/gate/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/gate/proxy_router.inc:/etc/nginx/gate/proxy_router.inc:ro
      - ./generated/nginx/gate-http:/etc/nginx/http-generated:ro
      - ./generated/nginx/gate-stream:/etc/nginx/stream-generated:ro
      - ./generated/nginx/gate-tls:/etc/nginx/gate-tls:ro
      - ./nginx/errors:/usr/share/nginx/errors:ro
      - ./certs:/etc/nginx/certs:ro
      - ./state/scaling/markers:/etc/nginx/scaling/markers:ro
    restart: unless-stopped
    <<: *resources-edge

  raft-router:
    image: nginx:alpine
    expose:
      - "80"
    volumes:
      - ./nginx/router/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./generated/nginx/router:/etc/nginx/router-generated:ro
      - ./generated/nginx/upstreams:/etc/nginx/upstreams:ro
      - ./nginx/errors:/usr/share/nginx/errors:ro
    restart: unless-stopped
    <<: *resources-edge

  # Control plane: same raft package as the host CLI (built from ./controller).
  raft-controller:
    build:
      context: ./controller
    working_dir: /raft
    user: "${RAFT_HOST_UID:-0}:${RAFT_HOST_GID:-0}"
    # Socket is root:docker; host operator has docker via supplementary group.
    # Shell injects RAFT_DOCKER_GID from /var/run/docker.sock st_gid.
    group_add:
      - "${RAFT_DOCKER_GID:-0}"
    environment:
      RAFT_DATA_HOME: /raft
    expose:
      - "8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Data home read-only (avoid root-owned template files). Locks need write
      # for flock during heal/scale; scaling + metrics dirs are writable.
      # Host Shell injects RAFT_HOST_UID/GID so this process matches the operator.
      - .:/raft:ro
      - ./state/locks:/raft/state/locks
      - ./state/scaling:/raft/state/scaling
      - ./state/metrics:/raft/state/metrics
    restart: unless-stopped
    <<: *resources-controller

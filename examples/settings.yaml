# raft operator settings — copy to ~/.raft/settings.yaml
# (created on first use with defaults if missing).
# Override the data home with RAFT_DATA_HOME (default: ~/.raft).
#
# After changing edge published ports (http / https / streams), run:
#   raft gate recreate
# (not `raft redeploy gate` — that command refuses).

# ---------------------------------------------------------------------------
# logging — file logging only; the terminal stays plain text.
# Timed + size-split rotation (defaults: 30 days, 100 MiB per active
# segment). Enforced at CLI start (setup_logging) and on each emit —
# no full-file rewrite. Active file stays raft.log; sealed archives are
# raft.log.YYYY-MM-DD, then raft.log.YYYY-MM-DD.2, .3, … for same-day
# overflow. Age deletes sealed files by the date suffix.
# ---------------------------------------------------------------------------
logging:
  # Directory for log files. Relative paths are under the data home
  # (~/.raft/logs by default). Absolute paths are used as-is.
  # Override entirely with env RAFT_LOG_DIR.
  dir: logs

  # Log file name inside logging.dir (live append target).
  file: raft.log

  # Minimum level written to the file: DEBUG | INFO | WARNING | ERROR
  level: INFO

  # retentionMaxAgeDays: 30       # keep this many calendar days of archives
  # retentionMaxBytes: 104857600  # 100 MiB; max size of one day's active segment

# ---------------------------------------------------------------------------
# healing — raft-controller self-heal (Compose restart, then raft redeploy).
# Disabled by default; enable on the operator host after reviewing the policy.
# Apps only (never gate). Default path when enabled: observe → threshold →
# one Compose restart/start → one ensure_app_deployed (cutover/redeploy) →
# give up until the controller restarts.
# Separate from per-app scale-to-zero (`spec.scaling` on the App manifest);
# healer skips apps intentionally scaled to zero.
# ---------------------------------------------------------------------------
# healing:
#   enabled: true
#   intervalSeconds: 15           # heal job poll period (also wakes scale side-tick)
#   timeoutSeconds: 120           # soft join timeout for heal job (worker may
#                                 # continue; overlapping heals are skipped)
#   failThreshold: 3              # consecutive bad observations before act
#   cooldownSeconds: 60           # min time between heal acts on the same app
#   maxRestarts: 1                # Compose restart/start attempts (default: 1)
#   escalateAfterRestarts: 1      # after this many Compose restarts (or
#                                 # maxRestarts), raft cutover/redeploy (default: 1)

# ---------------------------------------------------------------------------
# metrics — raft-controller resource sampling (JSONL under state/metrics/).
# Independent cadence from healing. Defaults: 1 sample/min, soft timeout 30s,
# flush every 10 samples or 60s. Rotation matches host CLI logs: seal the active
# resources.jsonl on day change or when the active segment hits retentionMaxBytes
# (resources.jsonl.YYYY-MM-DD[.N]); drop sealed archives by age and total bytes.
# ---------------------------------------------------------------------------
# metrics:
#   intervalSeconds: 60           # periodic metrics job
#   timeoutSeconds: 30            # soft join timeout (worker may continue)
#   batchSize: 10                 # buffer before append
#   flushSeconds: 60              # time-based flush even if batch not full
#   retentionMaxAgeDays: 30       # delete sealed archives older than this
#   retentionMaxBytes: 104857600  # 100 MiB; max size of the active segment

# ---------------------------------------------------------------------------
# edge — public listeners published by the gate container.
#
# null (or omit via YAML null) for http/https → that listener is not published.
# streams[] entries are extra TCP/UDP listeners on the gate (nginx stream).
# Apps that use expose: stream must match a declared edge.streams[].port.
# Apps that use expose: host publish ports themselves — no edge entry needed.
# ---------------------------------------------------------------------------
edge:
  # Public HTTP port on the host (gate). Default 80.
  # Required for tls: acme (HTTP-01). Set to null to disable the HTTP listener entirely.
  http: 80
  # http: null

  # Public HTTPS port on the host (gate). Default 443.
  # Needed when any app uses tls: origin or tls: acme. Set to null to omit HTTPS.
  https: 443
  # https: null

  # Extra gate listeners for expose: stream apps (L4 proxy).
  # Empty list (default) means no stream listeners.
  streams: []
  # Example — uncomment (and gate recreate) when an app uses expose: stream:
  # streams:
  #   - name: smtp          # label only (for humans / docs)
  #     port: 25            # host port published by the gate
  #     protocol: tcp       # tcp | udp (default tcp)
  #   - name: dns
  #     port: 53
  #     protocol: udp

# ---------------------------------------------------------------------------
# Optional ACME (Let's Encrypt) — required when any app uses tls: acme.
# Direct HTTPS on the VPS (browser → DNS → gate :443). Not for Cloudflare
# Origin PEMs — those stay tls: origin + certs/<app>/origin.*.
#
# Checklist: DNS A/AAAA for publicHost + extraHosts → this host; TCP 80 and
# 443 open; set email below; raft apply; raft doctor [name]. Renewal is the
# controller (acme:<name>); do not paste PEMs. HTTP-01 is answered by the
# gate (works while the App is scaled to zero). DNS-01 / wildcards: not shipped.
# Do not set edge.http: null.
# ---------------------------------------------------------------------------
# acme:
#   email: ops@example.com
#   # Default: Let's Encrypt production. Staging for labs:
#   # directory: https://acme-staging-v02.api.letsencrypt.org/directory
#   directory: https://acme-v02.api.letsencrypt.org/directory
#   renewDaysBeforeExpiry: 30
#   challenge: http-01   # only http-01 in v1

# ---------------------------------------------------------------------------
# github — temporary OAuth for ``raft serve`` deploy assist (v1).
# Session file: ~/.raft/state/serve/github-session.json (mode 0600).
# Docs: docs/serve-github-deploy.md
# ---------------------------------------------------------------------------
# github:
#   mock: true                 # local fixture repos; no GitHub App needed
#   # clientId: Iv1.example    # OAuth App; callback http://127.0.0.1:<port>/api/github/callback
#   # clientSecret: …          # prefer RAFT_GITHUB_CLIENT_SECRET
#   # sessionTtlSeconds: 3600  # default 1h; logout clears the session file
# Env: RAFT_GITHUB_MOCK, RAFT_GITHUB_CLIENT_ID, RAFT_GITHUB_CLIENT_SECRET,
#      RAFT_GITHUB_SESSION_TTL_SECONDS
# Scopes: read:user repo (private listing; deploy keys pasted manually)

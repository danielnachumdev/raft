name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  spa:
    name: SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/spa/package-lock.json
      - name: Install, test, and build dashboard SPA
        run: |
          cd src/spa
          npm ci
          npm test
          npm run build

  meta:
    name: Meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.13"
      - name: Install package + test deps
        run: uv sync --extra dev
      - name: Meta tests (codebase-as-artifact)
        run: uv run pytest tests/meta --no-cov -n0

  test:
    name: Unit+Integration (Py ${{ matrix.python-version }})
    needs: [meta]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test deps
        run: uv sync --extra dev
      - name: Unit tests (100% coverage)
        run: uv run pytest tests/unit -q
      - name: Integration tests
        run: uv run pytest tests/integration -q --no-cov

  e2e:
    name: E2E (Py 3.9)
    needs: [test]
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'e2e' || fromJSON('null') }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.9"
      - name: Install package + test deps
        run: uv sync --extra dev
      - name: Seed images (ECR Public + local http-echo)
        run: bash "${GITHUB_WORKSPACE}/.github/workflows/ci_seed_docker_images.sh"
      - name: E2E Compose tests
        env:
          RAFT_E2E_REF: ${{ github.sha }}
        run: uv run pytest tests/e2e -m e2e -q --tb=short --no-cov -n0

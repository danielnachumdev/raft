# HTTPS via Cloudflare Origin certs on the gate (`tls: origin`).
# Apply (deploy on by default): raft apply --file examples/https-origin-site/.raft/app.yaml
#
# Install PEMs before first deploy (apply with deploy, or raft up after --no-deploy):
#   ~/.raft/services/https-origin-site/certs/origin.pem
#   ~/.raft/services/https-origin-site/certs/origin.key
# Missing PEMs make nginx reject the gate config → HTTP and HTTPS die.
# Operator settings need edge.https set (default 443); see examples/settings.yaml.

apiVersion: raft/v1
kind: App
metadata:
  name: https-origin-site

spec:
  publicHost: secure.example.com
  # Optional aliases (www is not automatic — list it when you need it):
  # extraHosts:
  #   - www.secure.example.com

  # origin → gate includes TLS snippets from services/<name>/certs/ for this host.
  tls: origin

  source: git
  repo: git@github.com:example/https-origin-site.git
  ref: main
  path: services/https-origin-site/checkout
  build:
    context: .
    dockerfile: Dockerfile

  ports:
    - name: http
      containerPort: 80
      # App still speaks HTTP to the router; the gate terminates TLS for clients.
      expose: http

  readiness:
    type: http
    port: http
    path: /

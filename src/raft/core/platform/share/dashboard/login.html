<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 2rem;
    }
    main { width: min(100%, 20rem); text-align: center; }
    h1 { font-size: 1.5rem; margin: 0 0 1.25rem; }
    label { display: block; text-align: left; margin: 0 0 0.35rem; color: #94a3b8; }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 0.65rem 0.75rem;
      border: 1px solid #334155;
      border-radius: 0.375rem;
      background: #1e293b;
      color: #e2e8f0;
      margin-bottom: 0.85rem;
    }
    button {
      width: 100%;
      padding: 0.7rem 1rem;
      border: 0;
      border-radius: 0.375rem;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 600;
      cursor: pointer;
    }
    #err { margin: 0.85rem 0 0; color: #f87171; }
  </style>
</head>
<body>
  <main>
    <h1>Sign in</h1>
    <form id="f" method="post" action="/api/dashboard/login">
      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
    <p id="err" hidden>Invalid password</p>
  </main>
  <script>
    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("err");
      err.hidden = true;
      const password = new FormData(e.target).get("password");
      const res = await fetch("/api/dashboard/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password }),
      });
      if (!res.ok) {
        err.hidden = false;
        return;
      }
      location.href = "/";
    });
  </script>
</body>
</html>

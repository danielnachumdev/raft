name: CI

# Top-level CI invoker. Validation only — never creates tags / Releases / wheels.
# Job bodies live in SRP reusable workflows:
#   ci_changes.yml — path filter / change detection
#   ci_spa.yml     — SPA install/test/build
#   ci_meta.yml    — meta / package-data guards
#   ci_unit.yml    — unit+integration matrix (version set via input)
#   ci_e2e.yml     — e2e (GHCR seed pins)
# Aggregate gate stays here so branch protection can require check name "CI".
# Semver / Release publish is CD (cd.yml), gated on this workflow succeeding.
# Seed mirror stays as its own workflow (already SRP).
#
# Pre-merge (pull_request) vs post-merge (push to main / workflow_dispatch):
#   Meta, SPA, E2E, aggregate — both (path-filtered).
#   Unit+Integration — PR runs Py 3.9+3.13 bookends; main/dispatch runs full
#   3.9–3.13. Every matrix cell + step still exists; middle versions move to
#   post-merge only so PR wall-clock drops without weakening the CD gate
#   (semver still waits for successful CI on main, which includes the full matrix).
#   E2E runs after Meta in parallel with Unit (not serialized behind the matrix).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # PR number or branch ref — never commit SHA (SHA-keyed groups cannot cancel
  # superseded runs; that burned parallel CI minutes elsewhere).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # dorny/paths-filter lists PR files via the API on pull_request events.
  pull-requests: read

# Path filters (dorny/paths-filter in ci_changes.yml):
#   python — Meta, Unit+Integration, E2E. Any Python source, packaging/lockfile,
#            pytest tree, install script, share templates Python loads, or CI
#            Python/orchestrator workflows / E2E seed script.
#   spa    — SPA job. Dashboard sources / lockfile under src/spa/, or SPA /
#            orchestrator CI workflows (packaged share/serve/spa/ is gitignored).
# workflow_dispatch forces both sides on. Docs-only / unrelated paths skip both;
# the aggregate "CI" job still succeeds so required checks can key off it.
# Do not add workflow-level `paths:` here — skipped required checks would block merges.

jobs:
  changes:
    name: Path filter
    uses: ./.github/workflows/ci_changes.yml

  spa:
    name: SPA
    needs: [changes]
    if: needs.changes.outputs.spa == 'true'
    uses: ./.github/workflows/ci_spa.yml

  meta:
    name: Meta
    needs: [changes]
    if: needs.changes.outputs.python == 'true'
    uses: ./.github/workflows/ci_meta.yml

  test:
    name: Unit+Integration
    needs: [changes, meta]
    if: needs.changes.outputs.python == 'true'
    uses: ./.github/workflows/ci_unit.yml
    with:
      # PR: oldest + newest supported. Main / dispatch: full support matrix.
      python-versions: ${{ github.event_name == 'pull_request' && '["3.9","3.13"]' || '["3.9","3.10","3.11","3.12","3.13"]' }}

  e2e:
    name: E2E (Py 3.9)
    needs: [changes, meta]
    if: needs.changes.outputs.python == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ci_e2e.yml

  # Always-green aggregate for branch protection when path filters skip jobs.
  # Prefer requiring this check ("CI") over Meta / Unit+Integration / E2E / SPA
  # by name — skipped required jobs otherwise block merges.
  # Nested reusable checks appear as "<caller name> / <job name>".
  ci:
    name: CI
    needs: [changes, spa, meta, test, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require success or intentional skip
        run: |
          set -euo pipefail
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "FAIL Path filter: ${{ needs.changes.result }}"
            exit 1
          fi
          python="${{ needs.changes.outputs.python }}"
          spa="${{ needs.changes.outputs.spa }}"
          echo "path filter: python=${python} spa=${spa}"
          echo "results: spa=${{ needs.spa.result }} meta=${{ needs.meta.result }} test=${{ needs.test.result }} e2e=${{ needs.e2e.result }}"

          fail=0
          accept() {
            local label="$1" result="$2" expect="$3"
            if [[ "$expect" != "true" ]]; then
              if [[ "$result" == "skipped" || "$result" == "success" ]]; then
                echo "OK  ${label}: ${result} (not required for this change set)"
                return
              fi
            fi
            if [[ "$result" == "success" ]]; then
              echo "OK  ${label}: ${result}"
              return
            fi
            echo "FAIL ${label}: ${result} (expected success when filter=${expect})"
            fail=1
          }

          accept SPA "${{ needs.spa.result }}" "${spa}"
          accept Meta "${{ needs.meta.result }}" "${python}"
          accept Unit+Integration "${{ needs.test.result }}" "${python}"
          accept E2E "${{ needs.e2e.result }}" "${python}"
          exit "${fail}"
